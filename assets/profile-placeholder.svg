<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EED596" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#997A2E" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B1917" />
      <stop offset="50%" stop-color="#131110" />
      <stop offset="100%" stop-color="#0A0908" />
    </linearGradient>
    <radialGradient id="goldGlow" cx="50%" cy="38%" r="48%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#997A2E" stop-opacity="0.08" />
      <stop offset="100%" stop-color="transparent" stop-opacity="0" />
    </radialGradient>
    <pattern id="goldGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(212, 175, 55, 0.08)" stroke-width="1"/>
    </pattern>
  </defs>
  
  <rect width="100%" height="100%" fill="url(#bgGrad)"/>
  <rect width="100%" height="100%" fill="url(#goldGrid)"/>
  <circle cx="300" cy="270" r="220" fill="url(#goldGlow)"/>
  
  <!-- Outer Gold Frame Lines -->
  <rect x="25" y="25" width="550" height="700" fill="none" stroke="rgba(212, 175, 55, 0.3)" stroke-width="1.2" stroke-dasharray="4 4"/>
  <circle cx="25" cy="25" r="3" fill="#D4AF37"/>
  <circle cx="575" cy="25" r="3" fill="#D4AF37"/>
  <circle cx="25" cy="725" r="3" fill="#D4AF37"/>
  <circle cx="575" cy="725" r="3" fill="#D4AF37"/>
  
  <!-- Monogram & Luxury Medallion -->
  <g transform="translate(150, 130)">
    <circle cx="150" cy="140" r="110" fill="none" stroke="rgba(212, 175, 55, 0.4)" stroke-width="1.5" stroke-dasharray="6 6"/>
    <circle cx="150" cy="140" r="92" fill="rgba(212, 175, 55, 0.08)" stroke="url(#goldGrad)" stroke-width="1.5"/>
    <text x="150" y="162" font-family="'Cormorant Garamond', Georgia, serif" font-size="70" font-weight="600" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="4">VK</text>
    <text x="150" y="194" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="600" fill="#D4AF37" text-anchor="middle" letter-spacing="3">VRUSHA KAMAT</text>
  </g>
  
  <!-- Interactive Indicator Box -->
  <g transform="translate(300, 470)" text-anchor="middle">
    <rect x="-115" y="-22" width="230" height="44" rx="22" fill="rgba(212, 175, 55, 0.15)" stroke="url(#goldGrad)" stroke-width="1.2"/>
    <circle cx="-80" cy="0" r="8" fill="none" stroke="#D4AF37" stroke-width="1.5"/>
    <circle cx="-80" cy="0" r="3.5" fill="#D4AF37"/>
    <text x="15" y="5" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="600" fill="#FBF8F2" letter-spacing="1.2">UPLOAD PHOTO</text>
  </g>
  
  <!-- Editorial Watermark -->
  <text x="300" y="565" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="500" fill="rgba(251, 248, 242, 0.85)" text-anchor="middle">Computer Science Engineering</text>
  <text x="300" y="590" font-family="'Space Grotesk', monospace" font-size="11" fill="rgba(212, 175, 55, 0.9)" text-anchor="middle" letter-spacing="1">Drop photo or save as assets/profile.jpg</text>
  <line x1="210" y1="625" x2="390" y2="625" stroke="rgba(212, 175, 55, 0.3)" stroke-width="1"/>
  <text x="300" y="655" font-family="'Space Grotesk', sans-serif" font-size="10" fill="rgba(251, 248, 242, 0.5)" text-anchor="middle" letter-spacing="2">EDITION 2026</text>
</svg>